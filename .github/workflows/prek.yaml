name: Prek checks
"on": [push, pull_request]
jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      # A hook in prek.toml runs Spotless's Groovy-Eclipse formatter when a .gradle file changes.
      # Restoring the cache that the "spotless" job of gradle.yml saves lets that hook run without
      # downloading from the Eclipse P2 repositories, which fails often.  This job never saves the
      # cache, because most runs of this job do not populate it.
      #
      # The key computation repeats the one in the "spotless" job of gradle.yml, and must be kept in
      # step with it.  Naming the key exactly, rather than reaching an entry through "restore-keys",
      # restores only an entry for the formatter version that this checkout uses.
      - name: Compute the Spotless P2 cache key
        id: spotless-p2-key
        run: |
          set -eu
          greclipse="$(sed -n 's/^greclipse *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          spotless="$(sed -n 's/^com-diffplug-spotless *=.*version *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          if [ -z "$greclipse" ] || [ -z "$spotless" ]; then
            echo "Cannot read the Groovy-Eclipse and Spotless versions from gradle/libs.versions.toml" >&2
            exit 1
          fi
          echo "key=spotless-p2-${{ runner.os }}-greclipse-$greclipse-spotless-$spotless" >> "$GITHUB_OUTPUT"
      # No entry carries a lock file, because the "spotless" job deletes the lock file before saving.
      - name: Restore Spotless P2 cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches/p2-data
          key: ${{ steps.spotless-p2-key.outputs.key }}
      - uses: j178/prek-action@v3.0.0
